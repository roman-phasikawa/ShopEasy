<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopNow</title>
    <link rel="stylesheet" href="./output.css" />
  </head>
  <body>
    <header class="">
      <nav class="flex justify-between py-4 px-6 bg-white sticky top-0">
        <a href="#" class="text-blue-600 font-bold">ShopEasy</a>
        <div class="flex gap-3">
          <a href="#">Home</a>
          <a href="#">Products</a>
          <a href="#">Cards</a>
          <a href="#">Checkout</a>
        </div>
      </nav>
    </header>
    <section>
      <div class="bg-blue-500 text-white py-24 text-center">
        <h1 class="text-6xl font-bold">Welcome to ShopEasy</h1>
        <p class="my-2">Best Product at affordable prices</p>
        <button class="bg-white text-blue-600 px-6 py-2 rounded font-semibold">
          ShopNow
        </button>
      </div>
    </section>
    <section class="max-w-7xl mx-auto py-17 px-6">
      <h2 class="text-center mb-4 mt-3.5 text-3xl font-bold">Our Products</h2>
      <div class="grid grid-col-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <div class="bg-white rounded shadow overflow-hidden">
          <img
            src="https://images.unsplash.com/photo-1558981403-c5f9899a28bc?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8YmlrZXxlbnwwfHwwfHx8MA%3D%3D"
            alt="bike img"
            class="w-full h-50 object-cover"
          />
          <div class="p-4">
            <h4 class="font-bold text-lg">Bike</h4>
            <p>$1999</p>
            <button class="bg-blue-600 text-white px-3 py-2 rounded">
              Add to Cart
            </button>
          </div>
        </div>
        <div class="bg-white rounded shadow overflow-hidden">
          <img
            src="https://images.unsplash.com/photo-1580273916550-e323be2ae537?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8Y2FyfGVufDB8fDB8fHww"
            alt="car img"
            class="w-full h-50 object-cover"
          />
          <div class="p-4">
            <h4 class="font-bold text-lg">Car</h4>
            <p>$9999</p>
            <button class="bg-blue-600 text-white px-3 py-2 rounded">
              Add to Cart
            </button>
          </div>
        </div>
        <div class="bg-white rounded shadow overflow-hidden">
          <img
            src="https://images.unsplash.com/photo-1554223789-df81106a45ed?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8c2Nvb3RlcnxlbnwwfHwwfHx8MA%3D%3D"
            alt="scooter img"
            class="w-full h-50 object-cover"
          />
          <div class="p-4">
            <h4 class="font-bold text-lg">Scooter</h4>
            <p>$1599</p>
            <button class="bg-blue-600 text-white px-3 py-2 rounded">
              Add to Cart
            </button>
          </div>
        </div>
        <div class="bg-white rounded shadow overflow-hidden">
          <img
            src="https://images.unsplash.com/photo-1582743514780-b381c39ada9f?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8ZS1iaWN5Y2xlfGVufDB8fDB8fHww"
            alt="bike img"
            class="w-full h-50 object-cover"
          />
          <div class="p-4">
            <h4 class="font-bold text-lg">Bicycle</h4>
            <p>$999</p>
            <button class="bg-blue-600 text-white px-3 py-2 rounded">
              Add to Cart
            </button>
          </div>
        </div>
        <div class="bg-white rounded shadow overflow-hidden">
          <img
            src="https://plus.unsplash.com/premium_photo-1664302152991-d013ff125f3f?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8YnVzfGVufDB8fDB8fHww"
            alt="bus img"
            class="w-full h-50 object-cover"
          />
          <div class="p-4">
            <h4 class="font-bold text-lg">Bus</h4>
            <p>$49999</p>
            <button class="bg-blue-600 text-white px-3 py-2 rounded">
              Add to Cart
            </button>
          </div>
        </div>
      </div>
    </section>
    <section class="py-17">
      <div class="bg-white max-w-2xl mx-auto rounded shadow p-8 ">
        <h2 class="text-2xl font-bold mb-4">Billing Form</h2>
        <form action="#">
          <input
            type="text"
            placeholder="Full Name"
            class="border p-2 w-full mb-3"
          />
          <input type="email" placeholder="Email" class="border p-2 w-full mb-3" />
          <input type="text-area" placeholder="Address" class="border p-2 w-full mb-3" />
          <button class="bg-blue-600 text-white rounded px-4 py-2 p-2 w-full mb-3">
            Place Order
          </button>
        </form>
      </div>
    </section>
    <footer class="bg-blue-700 p-4 text-center">&copy; 2026 ShopEasy.All right reserved.</footer>
  </body>
</html>
